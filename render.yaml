services:
  - type: web
    name: auth-service
    runtime: docker
    plan: free
    rootDir: gothalo/backend
    dockerfilePath: services/auth/Dockerfile
    dockerContext: .
    envVars:
      - key: REDIS_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false

  - type: web
    name: agent-service
    runtime: docker
    plan: free
    rootDir: gothalo/backend
    dockerfilePath: services/agent/Dockerfile
    dockerContext: .
    envVars:
      - key: REDIS_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false

  - type: web
    name: gateway
    runtime: docker
    plan: free
    rootDir: gothalo/backend
    dockerfilePath: gateway/Dockerfile
    dockerContext: .
    envVars:
      - key: AUTH_SERVICE_URL
        value: https://auth-service.onrender.com
      - key: AGENT_SERVICE_URL
        value: https://agent-service.onrender.com

  - type: web
    name: frontend
    runtime: static
    rootDir: gothalo/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://gateway.onrender.com